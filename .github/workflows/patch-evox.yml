name: ROM Patch Builder — VoLTE/VoWiFi RU

on:
  workflow_dispatch:
    inputs:
      GDRIVE_FILE_ID:
        required: true
        description: "Google Drive file ID"
      DEVICE:
        required: true
        default: "device"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    # ─────────────────────────────
    # SETUP
    # ─────────────────────────────

    - name: Free space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
        sudo apt-get clean
        df -h

    - name: Install tools
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          wget unzip zip python3 python3-pip \
          e2fsprogs file xxd

    - name: Install payload-dumper-go
      run: |
        wget -q https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz
        tar xf payload-dumper-go_1.2.2_linux_amd64.tar.gz
        sudo mv payload-dumper-go /usr/local/bin/

    # ─────────────────────────────
    # DOWNLOAD ROM
    # ─────────────────────────────

    - name: Download ROM
      run: |
        pip3 install -q gdown
        gdown "https://drive.google.com/uc?id=${{ github.event.inputs.GDRIVE_FILE_ID }}" -O rom.zip
        ls -lh rom.zip

    # ─────────────────────────────
    # DETECT FORMAT
    # ─────────────────────────────

    - name: Detect format
      run: |
        if unzip -l rom.zip | grep -q payload.bin; then
          echo "FORMAT=payload" >> $GITHUB_ENV
        else
          echo "FORMAT=zip" >> $GITHUB_ENV
        fi

    # ─────────────────────────────
    # EXTRACT
    # ─────────────────────────────

    - name: Extract ZIP ROM
      if: env.FORMAT == 'zip'
      run: unzip -q rom.zip -d rom

    - name: Extract payload
      if: env.FORMAT == 'payload'
      run: |
        unzip -j rom.zip payload.bin -d payload
        mkdir -p extracted
        payload-dumper-go -o extracted payload/payload.bin
        ls -lh extracted || true

    # ─────────────────────────────
    # PATCH ENGINE
    # ─────────────────────────────

    - name: Apply VoLTE/VoWiFi patch
      run: |
        set -e

        ROOT=rom
        [ "$FORMAT" = "payload" ] && ROOT=extracted

        echo "📡 Patching ROM in $ROOT"

        mkdir -p "$ROOT/system/etc/CarrierSettings"

        cat > "$ROOT/system/etc/CarrierSettings/ru_volte.xml" << 'XML'
<?xml version="1.0" encoding="UTF-8"?>
<carrier_config_list>
  <carrier_config>
    <mcc>250</mcc>

    <bool name="carrier_volte_available_bool">true</bool>
    <bool name="carrier_wfc_ims_available_bool">true</bool>
    <bool name="enhanced_4g_lte_on_by_default_bool">true</bool>

    <bool name="carrier_wfc_supports_wifi_only_bool">true</bool>
    <int name="carrier_default_wfc_ims_mode_int">2</int>

    <bool name="ims_service_enable_bool">true</bool>
  </carrier_config>
</carrier_config_list>
XML

        # IMS permissions
        mkdir -p "$ROOT/system/etc/default-permissions"

        cat > "$ROOT/system/etc/default-permissions/ims.xml" << 'XML'
<exceptions>
  <exception package="com.android.phone">
    <permission name="android.permission.MODIFY_PHONE_STATE" fixed="true"/>
  </exception>

  <exception package="com.android.ims">
    <permission name="android.permission.READ_PHONE_STATE" fixed="true"/>
  </exception>
</exceptions>
XML

        # props patch (safe)
        for F in "$ROOT/system/build.prop" "$ROOT/vendor/build.prop"; do
          [ -f "$F" ] || continue

          sed -i '/persist.dbg.volte_avail_ovr/d' "$F" || true

          cat >> "$F" << EOF
persist.dbg.volte_avail_ovr=1
persist.dbg.wfc_avail_ovr=1
persist.data.iwlan.enable=true
persist.ims.volte_enable=1
EOF
        done

        echo "✅ patch applied"

    # ─────────────────────────────
    # REPACK ZIP (ZIP ROM ONLY)
    # ─────────────────────────────

    - name: Repack ZIP ROM
      if: env.FORMAT == 'zip'
      run: |
        cd rom
        zip -r -0 ../rom_patched.zip .
        cd ..
        echo "📦 ZIP built"

    # ─────────────────────────────
    # REPACK PAYLOAD (SAFE MODE)
    # ─────────────────────────────

    - name: Build payload output
      if: env.FORMAT == 'payload'
      run: |
        mkdir -p result

        for f in system.img product.img vendor.img boot.img; do
          [ -f "extracted/$f" ] && cp "extracted/$f" result/
        done

        cat > result/FLASH.txt << 'EOF'
fastboot flash system system.img
fastboot flash product product.img
fastboot flash vendor vendor.img
fastboot -w
fastboot reboot
EOF

        echo "📦 payload artifacts ready"

    # ─────────────────────────────
    # UPLOAD
    # ─────────────────────────────

    - name: Upload ZIP
      if: env.FORMAT == 'zip'
      uses: actions/upload-artifact@v4
      with:
        name: rom-patched-${{ github.event.inputs.DEVICE }}
        path: rom_patched.zip

    - name: Upload payload
      if: env.FORMAT == 'payload'
      uses: actions/upload-artifact@v4
      with:
        name: rom-patched-${{ github.event.inputs.DEVICE }}
        path: result
