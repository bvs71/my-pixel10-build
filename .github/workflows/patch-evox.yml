name: Patch Evolution X — Megafon VoLTE/VoWiFi (Stable)

on:
  workflow_dispatch:
    inputs:
      GDRIVE_FILE_ID:
        required: true
        description: "Google Drive file ID"
      DEVICE:
        required: true
        default: "frankel"

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:

    # ─────────────────────────────
    # ENV SETUP
    # ─────────────────────────────

    - name: Free space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
        sudo apt-get clean
        df -h

    - name: Install tools
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          wget unzip zip python3 python3-pip \
          e2fsprogs file xxd android-sdk-libsparse-utils

    - name: Install payload-dumper-go
      run: |
        wget -q https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz
        tar xf payload-dumper-go_1.2.2_linux_amd64.tar.gz
        sudo mv payload-dumper-go /usr/local/bin/

    # ─────────────────────────────
    # DOWNLOAD ROM
    # ─────────────────────────────

    - name: Download ROM
      run: |
        pip3 install -q gdown
        gdown "https://drive.google.com/uc?id=${{ github.event.inputs.GDRIVE_FILE_ID }}" -O rom.zip
        ls -lh rom.zip

    # ─────────────────────────────
    # DETECT FORMAT
    # ─────────────────────────────

    - name: Detect format
      run: |
        if unzip -l rom.zip | grep -q payload.bin; then
          echo "FORMAT=payload" >> $GITHUB_ENV
        else
          echo "FORMAT=zip" >> $GITHUB_ENV
        fi

    # ─────────────────────────────
    # ZIP PATH (LEGACY)
    # ─────────────────────────────

    - name: Extract ZIP
      if: env.FORMAT == 'zip'
      run: unzip -q rom.zip -d rom

    - name: Patch ZIP safely
      if: env.FORMAT == 'zip'
      run: |
        set -e
        ROOT=rom
        FILE="$ROOT/system/etc/CarrierSettings/megafon_volte.xml"

        mkdir -p "$(dirname "$FILE")"

        cat > "$FILE" << 'XML'
<?xml version="1.0" encoding="UTF-8"?>
<carrier_config_list>
  <carrier_config>
    <mcc>250</mcc>
    <mnc>02</mnc>
    <bool name="carrier_volte_available_bool">true</bool>
    <bool name="carrier_wfc_ims_available_bool">true</bool>
    <bool name="enhanced_4g_lte_on_by_default_bool">true</bool>
  </carrier_config>
</carrier_config_list>
XML

        echo "ZIP patch done"

    # ─────────────────────────────
    # PAYLOAD PATH (MODERN ROM)
    # ─────────────────────────────

    - name: Extract payload.bin
      if: env.FORMAT == 'payload'
      run: |
        unzip -j rom.zip payload.bin -d payload
        mkdir -p extracted

    - name: Dump images
      if: env.FORMAT == 'payload'
      run: |
        payload-dumper-go -o extracted payload/payload.bin || true
        ls -lh extracted || true

    # ─────────────────────────────
    # SAFE DETECTION ENGINE
    # ─────────────────────────────

    - name: Detect partitions (safe)
      if: env.FORMAT == 'payload'
      run: |
        echo "Available images:"
        for f in extracted/*.img; do
          [ -e "$f" ] || continue
          echo "FOUND: $f"
        done

    # ─────────────────────────────
    # SAFE PATCH ENGINE (NO CRASH)
    # ─────────────────────────────

    - name: Safe FS handling (NO FAIL)
      if: env.FORMAT == 'payload'
      run: |
        set +e

        patch_fs () {
          IMG="$1"

          if [ ! -f "$IMG" ]; then
            echo "skip $IMG"
            return
          fi

          TYPE=$(file "$IMG")

          echo "$IMG -> $TYPE"

          if echo "$TYPE" | grep -q "ext"; then
            echo "fsck: $IMG"
            e2fsck -p "$IMG" || true
          else
            echo "skip fsck (not ext4): $IMG"
          fi
        }

        for f in extracted/system.img extracted/product.img extracted/vendor.img; do
          patch_fs "$f"
        done

        set -e

    # ─────────────────────────────
    # SAFE MOUNT (OPTIONAL)
    # ─────────────────────────────

    - name: Mount safely
      if: env.FORMAT == 'payload'
      run: |
        mkdir -p mnt/system mnt/product

        set +e

        [ -f extracted/system.img ] && sudo mount -o loop,rw extracted/system.img mnt/system || true
        [ -f extracted/product.img ] && sudo mount -o loop,rw extracted/product.img mnt/product || true

        set -e

    # ─────────────────────────────
    # PATCH ENGINE (CLEAN)
    # ─────────────────────────────

    - name: Apply patches
      if: env.FORMAT == 'payload'
      run: |
        set +e

        # Carrier config
        if [ -d mnt/product ]; then
          FILE="mnt/product/etc/CarrierSettings/megafon_volte.xml"
          mkdir -p "$(dirname "$FILE")"

          cat > "$FILE" << 'XML'
<?xml version="1.0" encoding="UTF-8"?>
<carrier_config_list>
  <carrier_config>
    <mcc>250</mcc>
    <mnc>02</mnc>
    <bool name="carrier_volte_available_bool">true</bool>
    <bool name="carrier_wfc_ims_available_bool">true</bool>
  </carrier_config>
</carrier_config_list>
XML
        fi

        # IMS permissions
        if [ -d mnt/system ]; then
          mkdir -p mnt/system/etc/default-permissions

          cat > mnt/system/etc/default-permissions/megafon_ims.xml << 'XML'
<?xml version="1.0" encoding="utf-8"?>
<exceptions>
  <exception package="com.android.phone">
    <permission name="android.permission.MODIFY_PHONE_STATE" fixed="true"/>
  </exception>
</exceptions>
XML
        fi

        set -e

    # ─────────────────────────────
    # CLEANUP
    # ─────────────────────────────

    - name: Unmount
      if: env.FORMAT == 'payload'
      run: |
        sudo umount mnt/system || true
        sudo umount mnt/product || true

    # ─────────────────────────────
    # BUILD ARTIFACTS
    # ─────────────────────────────

    - name: Build result
      if: env.FORMAT == 'payload'
      run: |
        mkdir -p result

        for f in system.img product.img vendor.img boot.img dtbo.img; do
          [ -f "extracted/$f" ] && cp "extracted/$f" result/
        done

        cat > result/FLASH.txt << 'EOF'
fastboot flash system system.img
fastboot flash product product.img
fastboot flash vendor vendor.img
fastboot -w
fastboot reboot
EOF

        ls -lh result

    # ─────────────────────────────
    # UPLOAD
    # ─────────────────────────────

    - name: Upload ZIP
      if: env.FORMAT == 'zip'
      uses: actions/upload-artifact@v4
      with:
        name: evox-zip-${{ github.event.inputs.DEVICE }}
        path: rom

    - name: Upload payload
      if: env.FORMAT == 'payload'
      uses: actions/upload-artifact@v4
      with:
        name: evox-payload-${{ github.event.inputs.DEVICE }}
        path: result
