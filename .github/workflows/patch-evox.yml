name: Patch Evolution X — Megafon VoLTE/VoWiFi

on:
  workflow_dispatch:
    inputs:
      GDRIVE_FILE_ID:
        description: 'Google Drive file ID'
        required: true
      DEVICE:
        description: 'Device codename'
        required: true
        default: 'frankel'

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:

    # ─────────────────────────────
    # ENV PREP
    # ─────────────────────────────

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
        sudo apt-get clean
        df -h

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          wget unzip zip python3 python3-pip \
          e2fsprogs android-sdk-libsparse-utils xxd file

    - name: Install payload-dumper-go
      run: |
        wget -q https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz
        tar xf payload-dumper-go_1.2.2_linux_amd64.tar.gz
        sudo mv payload-dumper-go /usr/local/bin/

    # ─────────────────────────────
    # DOWNLOAD ROM
    # ─────────────────────────────

    - name: Download ROM
      run: |
        pip3 install -q gdown
        gdown "https://drive.google.com/uc?id=${{ github.event.inputs.GDRIVE_FILE_ID }}" -O rom.zip
        ls -lh rom.zip

    # ─────────────────────────────
    # FORMAT DETECTION
    # ─────────────────────────────

    - name: Detect ROM format
      run: |
        if unzip -l rom.zip | grep -q payload.bin; then
          echo "FORMAT=payload" >> $GITHUB_ENV
        else
          echo "FORMAT=zip" >> $GITHUB_ENV
        fi

    # ─────────────────────────────
    # ZIP BRANCH (LEGACY ROMS)
    # ─────────────────────────────

    - name: Extract ZIP
      if: env.FORMAT == 'zip'
      run: unzip -q rom.zip -d rom

    - name: Patch ZIP ROM
      if: env.FORMAT == 'zip'
      run: |
        ROOT=rom

        mkdir -p "$ROOT/system/etc/CarrierSettings"

        cat > "$ROOT/system/etc/CarrierSettings/megafon_volte.xml" << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<carrier_config_list>
  <carrier_config>
    <mcc>250</mcc><mnc>02</mnc>
    <bool name="carrier_volte_available_bool">true</bool>
    <bool name="carrier_wfc_ims_available_bool">true</bool>
    <bool name="enhanced_4g_lte_on_by_default_bool">true</bool>
  </carrier_config>
</carrier_config_list>
EOF

    # ─────────────────────────────
    # PAYLOAD BRANCH (MODERN ROMS)
    # ─────────────────────────────

    - name: Extract payload.bin
      if: env.FORMAT == 'payload'
      run: |
        unzip -j rom.zip payload.bin -d payload
        ls -lh payload

    - name: Dump images
      if: env.FORMAT == 'payload'
      run: |
        mkdir -p extracted
        payload-dumper-go -o extracted payload/payload.bin
        ls -lh extracted || true

    - name: Detect partitions safely
      if: env.FORMAT == 'payload'
      run: |
        echo "Available images:"
        ls extracted || true

        for f in system.img product.img vendor.img system_ext.img; do
          if [ -f "extracted/$f" ]; then
            echo "FOUND: $f"
          else
            echo "MISSING: $f"
          fi
        done

    # ─────────────────────────────
    # SAFE PATCHING (NO CRASHES)
    # ─────────────────────────────

    - name: Apply safe patches
      if: env.FORMAT == 'payload'
      run: |
        set +e

        for IMG in system.img product.img vendor.img system_ext.img; do
          FILE="extracted/$IMG"

          if [ ! -f "$FILE" ]; then
            echo "skip $IMG"
            continue
          fi

          echo "processing $IMG"

          TYPE=$(file "$FILE")

          if echo "$TYPE" | grep -q "ext"; then
            e2fsck -p "$FILE" || true
          else
            echo "$IMG not ext4 -> skipping fsck"
          fi
        done

        set -e

    # ─────────────────────────────
    # MOUNT SAFE
    # ─────────────────────────────

    - name: Mount images safely
      if: env.FORMAT == 'payload'
      run: |
        mkdir -p mnt/system mnt/product

        set +e

        if [ -f extracted/system.img ]; then
          sudo mount -o loop,rw extracted/system.img mnt/system || true
        fi

        if [ -f extracted/product.img ]; then
          sudo mount -o loop,rw extracted/product.img mnt/product || true
        fi

        set -e

    # ─────────────────────────────
    # APPLY PATCHES
    # ─────────────────────────────

    - name: Apply VoLTE/IMS patches
      if: env.FORMAT == 'payload'
      run: |
        set +e

        if [ -d mnt/product ]; then
          sudo mkdir -p mnt/product/etc/CarrierSettings
          sudo cp .github/files/megafon_volte.xml \
            mnt/product/etc/CarrierSettings/megafon_volte.xml || true
        fi

        if [ -d mnt/system ]; then
          sudo mkdir -p mnt/system/etc/default-permissions
          sudo cp .github/files/megafon_ims.xml \
            mnt/system/etc/default-permissions/megafon-ims.xml || true
        fi

        set -e

    # ─────────────────────────────
    # CLEAN UNMOUNT
    # ─────────────────────────────

    - name: Unmount safely
      if: env.FORMAT == 'payload'
      run: |
        sudo umount mnt/system || true
        sudo umount mnt/product || true

    # ─────────────────────────────
    # PACK RESULT
    # ─────────────────────────────

    - name: Prepare artifacts
      if: env.FORMAT == 'payload'
      run: |
        mkdir -p result

        for f in system.img product.img vendor.img boot.img dtbo.img; do
          if [ -f "extracted/$f" ]; then
            cp "extracted/$f" result/
          fi
        done

        cat > result/FLASH.txt << 'EOF'
fastboot flash system system.img
fastboot flash product product.img
fastboot flash vendor vendor.img
fastboot -w
fastboot reboot
EOF

        ls -lh result

    # ─────────────────────────────
    # UPLOAD
    # ─────────────────────────────

    - name: Upload ZIP result
      if: env.FORMAT == 'zip'
      uses: actions/upload-artifact@v4
      with:
        name: evox-zip-${{ github.event.inputs.DEVICE }}
        path: rom
        retention-days: 5

    - name: Upload payload result
      if: env.FORMAT == 'payload'
      uses: actions/upload-artifact@v4
      with:
        name: evox-payload-${{ github.event.inputs.DEVICE }}
        path: result
        retention-days: 5
