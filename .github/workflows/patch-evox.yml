name: ROM Builder (Stable)

on:
  workflow_dispatch:
    inputs:
      GDRIVE_FILE_ID:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      run: |
        sudo apt-get update -y
        sudo apt-get install -y python3 python3-pip
        pip3 install gdown

    - name: Download ROM
      run: |
        gdown "https://drive.google.com/uc?id=${{ github.event.inputs.GDRIVE_FILE_ID }}" -O rom.zip

    - name: Extract ROM
      run: |
        unzip -q rom.zip -d rom

    - name: Run Patch Engine
      run: |
        python3 engine.py rom
        
    - name: Repack ROM
      run: |
        cd rom
        zip -r ../ROM-PATCHED.zip .
        cd ..

    - name: Upload ROM artifact
      uses: actions/upload-artifact@v4
      with:
        name: EvolutionX-VoLTE-Patched
        path: ROM-PATCHED.zip
