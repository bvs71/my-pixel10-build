name: ROM VoLTE/VoWiFi Patcher

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'URL to download ROM ZIP'
        required: true
        type: string

jobs:
  patch-rom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Download ROM
        id: download-rom
        run: |
          echo "Downloading ROM from ${{ inputs.rom_url }}"
          wget -O rom.zip "${{ inputs.rom_url }}"
          if [ ! -f "rom.zip" ]; then
            echo "❌ Failed to download ROM"
            exit 1
          fi
          echo "✅ ROM downloaded successfully"

      - name: 📂 Unpack ROM
        id: unpack-rom
        run: |
          mkdir -p rom_unpacked
          unzip -q rom.zip -d rom_unpacked/
          if [ $? -ne 0 ]; then
            echo "❌ Failed to unpack ROM"
            exit 1
          fi
          ROOT=$(find rom_unpacked -type d -name "system" -o -name "product" | head -n1 | xargs dirname)
          echo "ROOT=$ROOT" >> $GITHUB_OUTPUT
          echo "✅ ROM unpacked to $ROOT"

      - name: 🛠 Apply VoLTE/VoWiFi patch
        id: apply-patch
        run: |
          ROOT="${{ steps.unpack-rom.outputs.ROOT }}"
          echo "Applying patch to $ROOT"

          # Check write permissions
          if [ ! -w "$ROOT" ]; then
            echo "❌ No write permissions in $ROOT"
            exit 1
          fi

          # 1. Create directories
          mkdir -p "$ROOT/product/etc/CarrierSettings" || { echo "❌ Failed to create CarrierSettings dir"; exit 1; }
          mkdir -p "$ROOT/system/etc/default-permissions" || { echo "❌ Failed to create default-permissions dir"; exit 1; }
          mkdir -p "$ROOT/system/product/etc/permissions" || { echo "❌ Failed to create permissions dir"; exit 1; }

          # 2. Create Carrier IMS config
          cat > "$ROOT/product/etc/CarrierSettings/ims_ru.xml" << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<carrier_config_list>
  <carrier_config>
    <mcc>250</mcc>
    <!-- VoLTE -->
    <bool name="carrier_volte_available_bool">true</bool>
    <bool name="carrier_volte_provisioning_required_bool">false</bool>
    <bool name="enhanced_4g_lte_on_by_default_bool">true</bool>
    <!-- VoWiFi -->
    <bool name="carrier_wfc_ims_available_bool">true</bool>
    <bool name="carrier_wfc_supports_wifi_only_bool">true</bool>
    <bool name="carrier_wfc_supports_wifi_preferred_bool">true</bool>
    <int name="carrier_default_wfc_ims_mode_int">2</int>
    <!-- IMS CORE -->
    <bool name="ims_service_enable_bool">true</bool>
    <bool name="carrier_allow_turnoff_ims_bool">false</bool>
  </carrier_config>
</carrier_config_list>
EOF
          echo "✅ IMS config created"

          # 3. IMS permissions
          cat > "$ROOT/system/etc/default-permissions/ims.xml" << 'EOF'
<exceptions>
  <exception package="com.android.phone">
    <permission name="android.permission.MODIFY_PHONE_STATE" fixed="true"/>
  </exception>
  <exception package="com.android.ims">
    <permission name="android.permission.READ_PHONE_STATE" fixed="true"/>
    <permission name="android.permission.READ_PRIVILEGED_PHONE_STATE" fixed="true"/>
  </exception>
  <exception package="com.android.server.telecom">
    <permission name="android.permission.MODIFY_PHONE_STATE" fixed="true"/>
  </exception>
</exceptions>
EOF
          echo "✅ Permissions applied"

          # 4. Telephony features
          cat > "$ROOT/system/product/etc/permissions/ims_features.xml" << 'EOF'
<permissions>
  <feature name="android.hardware.telephony.ims"/>
  <feature name="android.hardware.telephony.calling"/>
  <feature name="android.software.vr.high_performance"/>
</permissions>
EOF
          echo "✅ Features applied"

          # 5. Properties
          for F in "$ROOT/system/build.prop" "$ROOT/vendor/build.prop"; do
            if [ -f "$F" ]; then
              sed -i '/persist.dbg.volte_avail_ovr/d' "$F" || true
              sed -i '/persist.dbg.wfc_avail_ovr/d' "$F" || true
              sed -i '/persist.data.iwlan.enable/d' "$F" || true
              sed -i '/persist.ims.volte_enable/d' "$F" || true

              cat >> "$F" << EOF
# IMS ENABLER
persist.dbg.volte_avail_ovr=1
persist.dbg.wfc_avail_ovr=1
persist.data.iwlan.enable=true
persist.ims.volte_enable=1
persist.ims.vt_enable=1
persist.ims.wfc_enable=1
EOF
              echo "✅ Properties updated in $F"
            else
              echo "⚠️ File not found: $F, skipping"
            fi
          done

      - name: 📦 Repack ROM
        id: repack-rom
        run: |
          cd rom_unpacked
          zip -r ../patched_rom.zip .
          cd ..
          if [ $? -ne 0 ]; then
            echo "❌ Failed to repack ROM"
            exit 1
          fi
          echo "✅ ROM repacked as patched_rom.zip"

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patched-rom
          path: patched_rom.zip
          retention-days: 7
